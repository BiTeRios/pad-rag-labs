[pytest]
# importlib: в каждом сервисе свои tests/conftest.py, имена модулей тестов не конфликтуют
addopts = -q --import-mode=importlib
pythonpath =
    libs/common
    services/auth-service
    services/auth-service/tests
    services/ingestion-service
    services/ingestion-service/tests
    services/inference-service
    services/indexing-service
    services/indexing-service/tests
    services/retrieval-service
    services/chat-service
    services/analytics-service
    gateway
testpaths =
    libs/common/tests
    services
    gateway/tests
    tests
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:Payload indexes have no effect in the local Qdrant
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
