# RabbitMQ — брокер событий (topic exchange rag.events + dead letter). StatefulSet: имя узла RabbitMQ
# (rabbit@rabbitmq-0) и каталог данных должны совпадать между перезапусками, иначе очереди «потеряются».
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: rag
  labels: {app: rabbitmq}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      enableServiceLinks: false  # иначе Kubernetes добавит RABBITMQ_PORT=tcp://..., а образ читает RABBITMQ_*
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3-management-alpine
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: {configMapKeyRef: {name: rag-common, key: RABBITMQ_USER}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: rag-secrets, key: RABBITMQ_PASSWORD}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
          readinessProbe:
            tcpSocket: {port: amqp}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:  # CLI RabbitMQ стартует ~1 с: проверка реже и с запасом по времени
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
