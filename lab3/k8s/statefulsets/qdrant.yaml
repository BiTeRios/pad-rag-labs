# Qdrant — векторная БД indexing-service (6497 chunks × 768). StatefulSet со своим томом: индекс переживает
# пересоздание пода, повторная индексация не нужна.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: rag
  labels: {app: qdrant}
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: {app: qdrant}
  template:
    metadata:
      labels: {app: qdrant}
    spec:
      enableServiceLinks: false  # иначе QDRANT_PORT=tcp://... попадёт в настройки Qdrant
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.2
          ports:
            - {name: http, containerPort: 6333}
            - {name: grpc, containerPort: 6334}
          volumeMounts:
            - {name: data, mountPath: /qdrant/storage}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
