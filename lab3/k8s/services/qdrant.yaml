# Qdrant: headless Service (clusterIP: None) для StatefulSet — имя qdrant указывает прямо на под qdrant-0.
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: rag
  labels: {app: qdrant}
spec:
  clusterIP: None
  selector: {app: qdrant}
  ports:
    - {name: http, port: 6333, targetPort: http}
    - {name: grpc, port: 6334, targetPort: grpc}
