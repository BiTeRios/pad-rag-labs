# inference-service: эмбеддинги и reranker. ClusterIP — доступен только внутри кластера: http://inference-service:8003
apiVersion: v1
kind: Service
metadata:
  name: inference-service
  namespace: rag
  labels: {app: inference-service}
spec:
  type: ClusterIP
  selector: {app: inference-service}
  ports:
    - {name: http, port: 8003, targetPort: http}
