# retrieval-service: поиск; запросы распределяются по всем готовым подам. ClusterIP — доступен только внутри кластера: http://retrieval-service:8005
apiVersion: v1
kind: Service
metadata:
  name: retrieval-service
  namespace: rag
  labels: {app: retrieval-service}
spec:
  type: ClusterIP
  selector: {app: retrieval-service}
  ports:
    - {name: http, port: 8005, targetPort: http}
