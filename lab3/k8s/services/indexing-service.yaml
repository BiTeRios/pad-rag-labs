# indexing-service: индекс Qdrant, /internal/search. ClusterIP — доступен только внутри кластера: http://indexing-service:8004
apiVersion: v1
kind: Service
metadata:
  name: indexing-service
  namespace: rag
  labels: {app: indexing-service}
spec:
  type: ClusterIP
  selector: {app: indexing-service}
  ports:
    - {name: http, port: 8004, targetPort: http}
