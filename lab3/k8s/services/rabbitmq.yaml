# RabbitMQ: headless Service (clusterIP: None) для StatefulSet — имя rabbitmq указывает прямо на под rabbitmq-0.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: rag
  labels: {app: rabbitmq}
spec:
  clusterIP: None
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
