# chat-service: вопросы и история. ClusterIP — доступен только внутри кластера: http://chat-service:8006
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: rag
  labels: {app: chat-service}
spec:
  type: ClusterIP
  selector: {app: chat-service}
  ports:
    - {name: http, port: 8006, targetPort: http}
