# PostgreSQL: headless Service (clusterIP: None) для StatefulSet — имя postgres указывает прямо на под postgres-0.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rag
  labels: {app: postgres}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
