# analytics-service: оценки и статистика. ClusterIP — доступен только внутри кластера: http://analytics-service:8007
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: rag
  labels: {app: analytics-service}
spec:
  type: ClusterIP
  selector: {app: analytics-service}
  ports:
    - {name: http, port: 8007, targetPort: http}
