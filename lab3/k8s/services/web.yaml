# web: веб-интерфейс, открыт наружу как и gateway. NodePort 30081 на узле Minikube;
# с хоста: kubectl port-forward -n rag svc/web 8080:8080 → http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: rag
  labels: {app: web}
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30081}
