# ingestion-service: корпус документов. ClusterIP — доступен только внутри кластера: http://ingestion-service:8002
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: rag
  labels: {app: ingestion-service}
spec:
  type: ClusterIP
  selector: {app: ingestion-service}
  ports:
    - {name: http, port: 8002, targetPort: http}
