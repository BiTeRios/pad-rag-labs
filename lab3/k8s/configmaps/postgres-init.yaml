# Скрипт инициализации PostgreSQL (копия lab2/infrastructure/postgres/init-databases.sh): database per service —
# у каждого сервиса своя БД и свой пользователь, чужие БД закрыты (REVOKE ... FROM PUBLIC).
# Монтируется в /docker-entrypoint-initdb.d и выполняется один раз — при первом старте с пустым томом.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: rag
data:
  init-databases.sh: |
    #!/bin/sh
    set -eu
    for service in auth ingestion chat analytics; do
        upper=$(echo "$service" | tr '[:lower:]' '[:upper:]')
        password=$(eval "printf '%s' \"\${${upper}_DB_PASSWORD}\"")
        echo "init: база и пользователь $service"
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
            -v name="$service" -v password="$password" <<'EOSQL'
    CREATE USER :"name" WITH PASSWORD :'password';
    CREATE DATABASE :"name" OWNER :"name";
    REVOKE ALL ON DATABASE :"name" FROM PUBLIC;
    EOSQL
    done
