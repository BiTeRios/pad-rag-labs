# Шаблон Secret — единственный файл с секретами в git, значения в нём ненастоящие.
# Настоящий k8s/secrets/secret.yaml (в .gitignore) создаёт scripts/make_secret.py со случайными паролями;
# вручную — скопировать этот файл в secret.yaml и заменить change-me (в паролях только [A-Za-z0-9_-]: они идут в URL).
# Сервисы получают только нужные им ключи (secretKeyRef в Deployment), а не весь Secret.
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag
type: Opaque
stringData:
  # PostgreSQL: суперпользователь и отдельный пароль для БД каждого сервиса (database per service)
  POSTGRES_PASSWORD: change-me-postgres
  AUTH_DB_PASSWORD: change-me-auth
  INGESTION_DB_PASSWORD: change-me-ingestion
  CHAT_DB_PASSWORD: change-me-chat
  ANALYTICS_DB_PASSWORD: change-me-analytics
  RABBITMQ_PASSWORD: change-me-rabbitmq
  # Подпись JWT: auth-service выпускает, gateway проверяет; не короче 32 символов
  JWT_SECRET: change-me-to-a-long-random-string-32-chars
  # Первый администратор (создаётся при старте auth-service)
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: change-me-admin
  # Необязательно: без токена GitHub API даёт 60 запросов в час
  GITHUB_TOKEN: ""
