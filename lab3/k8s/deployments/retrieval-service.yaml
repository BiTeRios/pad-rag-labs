# retrieval-service: query → вектор → Qdrant (через indexing-service) → фильтры → reranker. Без состояния:
# его масштабируем (kubectl scale ... --replicas=3), Service распределяет запросы по подам.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
  namespace: rag
  labels: {app: retrieval-service}
spec:
  replicas: 2
  selector:
    matchLabels: {app: retrieval-service}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: retrieval-service}
    spec:
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: retrieval-service
          image: rag/retrieval-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8005}
          envFrom:
            - configMapRef: {name: rag-common}
            - configMapRef: {name: retrieval-config}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:  # соседи (inference, indexing) отвечают на /health
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
