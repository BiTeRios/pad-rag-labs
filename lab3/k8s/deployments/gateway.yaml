# gateway: единая точка входа — маршрутизация, проверка JWT и ролей, rate limit, X-Request-ID.
# Снаружи кластера доступен только он (Service NodePort); остальные сервисы — ClusterIP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: rag
  labels: {app: gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: rag/gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: rag-common}   # адреса сервисов: AUTH_URL, CHAT_URL, …
            - configMapRef: {name: gateway-config}
          env:
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: rag-secrets, key: JWT_SECRET}}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
